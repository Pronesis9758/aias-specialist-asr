      revision: main
      format: transformers
      local_dir: /content/drive/MyDrive/AI_Specialist_ASR_Project/models/ct2/large-v3/float16
      conversion_quantization: float16
      device: cuda
      compute_type: float16
      beam_size: 5
    - id: turbo
