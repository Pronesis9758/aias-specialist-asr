quantization:
  enabled: true
  id: fixture-whisper-quantization-v1
  name: Whisper 양자화 비교 자동화 Fixture
  base_config: configs/local_benchmark_base.yaml
  evaluation_split: validation
  isolated_process: true
  continue_on_error: false
  reference_variant: float16
  model_cache_dir: models/quantized
  variants:
    - id: float16
      backend: fixture
      conversion_quantization: float16
      device: cpu
      compute_type: float16
    - id: int8-float16
      backend: fixture
      conversion_quantization: int8_float16
      device: cpu
      compute_type: int8_float16
